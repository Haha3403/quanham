<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn quân hàm</title>
<style>
:root{--bg:#f3efe6;--card:#fff;--ink:#1e2a22;--mut:#667;--acc:#2f5d3a;--ok:#1f7a3a;--bad:#b3261e;--line:#d8d2c2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15201a;--card:#1f2d25;--ink:#eef1e8;--mut:#9fb0a4;--acc:#7fc08d;--ok:#6fd08a;--bad:#ff8a80;--line:#34463a}}
:root[data-theme="dark"]{--bg:#15201a;--card:#1f2d25;--ink:#eef1e8;--mut:#9fb0a4;--acc:#7fc08d;--ok:#6fd08a;--bad:#ff8a80;--line:#34463a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.menu{min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px;max-width:480px;margin:auto}
.menu h1{font:700 30px/1.15 Georgia,"Times New Roman",serif;margin:0 0 6px}
.menu p{margin:0 0 10px;color:var(--mut)}
.big{padding:16px;border-radius:12px;border:2px solid var(--acc);background:var(--card);font-weight:600;font-size:18px;text-align:left}
.big.pri{background:var(--acc);color:#fff}
.big small{display:block;font-weight:400;opacity:.8;font-size:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bar button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px}
.tabs{display:flex;gap:6px;padding:10px 12px}
.tabs button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.sec{padding:4px 12px 12px}
.sec h3{margin:14px 0 8px;font:600 16px Georgia,serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:13px}
.cd svg{height:104px;width:auto;display:block;margin:0 auto 4px}
.quiz{height:100dvh;display:flex;flex-direction:column}
.pic{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.pic svg{height:100%;max-height:300px;width:auto}
.panel{background:var(--card);border-top:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:10px}
.ans{min-height:52px;border:2px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ans i{color:var(--mut);font-size:14px}
.bank{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bank .c{padding:11px 2px;border-radius:10px;text-align:center}
.c{padding:9px 14px;border-radius:999px;border:1px solid var(--acc);background:var(--bg);font-weight:600}
.c:disabled{opacity:.3}
.act{display:flex;gap:8px}
.act button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.act .go{background:var(--acc);color:#fff;border-color:var(--acc)}
.res{font-weight:600;font-size:15px}
.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.res span{display:block;font-weight:400;color:var(--ink)}
.opts{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 14px}
.opts b{display:block;padding:8px 0 2px;font-size:14px;color:var(--mut);font-weight:600}
.sw{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);position:relative}
.opts b+.sw{border-top:0}
.sw input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw i{width:46px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .15s;flex:none}
.sw i:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--acc)}
.sw input:checked+i:after{transform:translateX(20px)}
.sw input:focus-visible+i{outline:2px solid var(--acc);outline-offset:2px}
#msg{color:var(--bad);font-size:14px;min-height:1px}
.end{padding:30px 20px;text-align:center;display:flex;flex-direction:column;gap:14px;max-width:420px;margin:auto}
.end b{font:700 48px Georgia,serif}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById('app');
const P=['Thiếu','Trung','Thượng','Đại'];
const L=[];
const add=(f,g,k,n,o)=>L.push(Object.assign({f,g,k,n},o));
// Quân đội
P.forEach((p,i)=>add('qd','Cấp tướng','gen',p+' tướng',{s:i+1}));
P.forEach((p,i)=>add('qd','Sĩ quan cấp tá','ta',p+' tá',{s:i+1}));
P.forEach((p,i)=>add('qd','Sĩ quan cấp úy','uy',p+' úy',{s:i+1}));
P.slice(0,3).forEach((p,i)=>add('qd','Hạ sĩ quan','hsq',['Hạ','Trung','Thượng'][i]+' sĩ',{b:i+1}));
['Binh nhì','Binh nhất'].forEach((n,i)=>add('qd','Binh sĩ','binh',n,{b:i+1}));
// Công an
P.forEach((p,i)=>add('ca','Cấp tướng','gen',p+' tướng',{s:i+1}));
[['Sĩ quan nghiệp vụ','#f2c94c'],['Sĩ quan chuyên môn kĩ thuật','#7a4fb0']].forEach(([g,c])=>{
  P.forEach((p,i)=>add('ca',g+' - cấp tá','ta',p+' tá',{s:i+1,c}));
  P.forEach((p,i)=>add('ca',g+' - cấp úy','uy',p+' úy',{s:i+1,c}));
});
[['Hạ sĩ quan nghiệp vụ','#f2c94c'],['Hạ sĩ quan chuyên môn kĩ thuật','#7a4fb0'],['Hạ sĩ quan nghĩa vụ','#f2c94c']].forEach(([g,c])=>
  ['Hạ','Trung','Thượng'].forEach((p,i)=>add('ca',g,'hsq',p+' sĩ',{b:i+1,c})));
['Binh nhì','Binh nhất'].forEach((n,i)=>add('ca','Chiến sĩ nghĩa vụ','binh',n,{b:i+1}));

function svg(r){
  const qd=r.f=='qd',k=r.k;let fill,stroke,b='';
  if(k=='gen'){fill=qd?'#6b5a2e':'#7a1f2b';stroke='#4a1a14'}
  else if(k=='ta'||k=='uy'){fill=qd?'#f2d33a':'#d8392b';stroke=qd?'#b33':'#7a1a14'}
  else{fill=qd?'#cfcfc8':'#d9566e';stroke=qd?'#c33':'#9a2a40'}
  if(qd&&(k=='ta'||k=='uy')){const n=k=='ta'?2:1;for(let i=0;i<n;i++)b+=`<rect x="8" y="${12+i*7}" width="44" height="3.5" fill="#7a2a1a"/>`}
  if(!qd&&(k=='ta'||k=='uy')){const n=k=='ta'?2:1;for(let i=0;i<n;i++)b+=`<rect x="${n==1?27:21+i*12}" y="8" width="6" height="86" fill="${r.c}"/>`}
  if(r.s){let pts;
    if(qd){const y0=k=='gen'?26:34;pts=[...Array(r.s)].map((_,i)=>[30,y0+i*15])}
    else if(k=='gen')pts=[...Array(r.s)].map((_,i)=>[30,46+(i-(r.s-1)/2)*18]);
    else pts=[[[30,50]],[[20,22],[40,22]],[[20,22],[40,22],[30,56]],[[20,22],[40,22],[30,44],[30,66]]][r.s-1];
    const cu=!qd&&k!='gen';
    b+=pts.map(([x,y])=>`<text x="${x}" y="${y}" font-size="14" text-anchor="middle" fill="${k=='gen'?'#e8c34a':cu?'#f5d36a':'#7a4a10'}"${cu?' stroke="#5a3a00" stroke-width=".5"':''}>★</text>`).join('')}
  if(k=='hsq')for(let i=0;i<r.b;i++)b+=qd?`<rect x="8" y="${14+i*9}" width="44" height="4" fill="#c33"/>`:`<rect x="8" y="${50+i*10}" width="44" height="5" fill="${r.c}"/>`;
  if(k=='binh')for(let i=0;i<r.b;i++)b+=`<path d="M8 ${14+i*12} L30 ${30+i*12} L52 ${14+i*12}" fill="none" stroke="${qd?'#c33':'#e8c34a'}" stroke-width="4"/>`;
  return `<svg viewBox="0 0 60 120" xmlns="http://www.w3.org/2000/svg"><polygon points="6,6 54,6 54,92 30,114 6,92" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>${b}<circle cx="30" cy="97" r="6.5" fill="#e8c34a" stroke="#a8842a"/><text x="30" y="100.5" font-size="9" text-anchor="middle" fill="#a8842a">★</text></svg>`;
}

const cfg={qd:true,ca:true,hsq:true,binh:true,snd:true};
let AC;
const SFX={ok:new Audio('correct.mp3'),bad:new Audio('incorrect.mp3')};
Object.values(SFX).forEach(a=>a.preload='auto');
function snd(t){if(!cfg.snd)return;
  const a=SFX[t];if(!a)return beep(t);
  try{a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>beep(t))}catch(e){beep(t)}}
function beep(t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();
  const seq={tap:[[660,.05]],ok:[[660,.1],[880,.16]],bad:[[220,.18],[160,.25]],win:[[523,.1],[659,.1],[784,.1],[1047,.25]]}[t];let at=AC.currentTime;
  seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=t=='bad'?'sawtooth':'sine';o.frequency.value=f;g.gain.setValueAtTime(.15,at);g.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(g);g.connect(AC.destination);o.start(at);o.stop(at+d);at+=d*.9})}catch(e){}}
function menu(){
  app.innerHTML=`<div class="menu"><h1>Ôn quân hàm</h1><p>Quân đội nhân dân và Công an nhân dân Việt Nam.</p>
  <button class="big" onclick="view('all')">Xem tất cả<small>Tra cứu cấp hiệu theo nhóm</small></button>
  <div class="opts"><b>Nội dung trắc nghiệm</b>${[['qd','Quân hàm Quân đội'],['ca','Quân hàm Công an'],['hsq','Hạ sĩ quan (hạ sĩ, trung sĩ, thượng sĩ)'],['binh','Binh sĩ / chiến sĩ (binh nhì, binh nhất)']].map(sw).join('')}<b>Khác</b>${sw(['snd','Âm thanh'])}</div>
  <div id="msg"></div>
  <button class="big pri" onclick="start()">Bắt đầu trắc nghiệm<small>Nhìn cấp hiệu, ghép tên bằng các mảnh</small></button></div>`;
}
const sw=([k,n])=>`<label class="sw"><span>${n}</span><input type="checkbox" ${cfg[k]?'checked':''} onchange="cfg['${k}']=this.checked;snd('tap')"><i></i></label>`;
let tab='all';
function view(t){
  if(t)tab=t;
  const list=L.filter(r=>tab=='all'||r.f==tab);
  const groups=[];list.forEach(r=>{const key=(r.f=='qd'?'Quân đội: ':'Công an: ')+r.g;let g=groups.find(x=>x[0]==key);if(!g)groups.push(g=[key,[]]);g[1].push(r)});
  app.innerHTML=`<div class="bar"><button onclick="menu()">← Menu</button><b>Tất cả quân hàm</b><span></span></div>
  <div class="tabs">${[['all','Tất cả'],['qd','Quân đội'],['ca','Công an']].map(([k,n])=>`<button class="${tab==k?'on':''}" onclick="view('${k}')">${n}</button>`).join('')}</div>
  ${groups.map(([n,rs])=>`<div class="sec"><h3>${n}</h3><div class="grid">${rs.map(r=>`<div class="cd">${svg(r)}${r.n}</div>`).join('')}</div></div>`).join('')}`;
}

const TOK=['úy','tá','tướng','sĩ','Binh','Hạ','nhì','nhất','Thiếu','Trung','Thượng','Đại'];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let Q,qi,sel,bank,done,ok,wrong;
function start(){const pool=L.filter(r=>cfg[r.f]&&(cfg.hsq||r.k!='hsq')&&(cfg.binh||r.k!='binh'));
  if(!pool.length){document.getElementById('msg').textContent='Hãy bật ít nhất Quân đội hoặc Công an.';return}
  snd('tap');Q=shuf(pool).slice(0,20);qi=0;ok=0;wrong=[];next0()}
function next0(){sel=[];done=false;bank=TOK;quiz()}
function quiz(){
  const r=Q[qi];
  app.innerHTML=`<div class="quiz"><div class="bar"><button onclick="menu()">← Menu</button><span>Câu ${qi+1}/${Q.length}</span><span>Đúng: ${ok}</span></div>
  <div class="pic">${svg(r)}</div>
  <div class="panel"><div class="ans">${sel.length?sel.map((t,j)=>`<button class="c" ${done?'disabled':''} onclick="rm(${j})">${t}</button>`).join(''):'<i>Chạm các mảnh bên dưới để ghép tên quân hàm</i>'}</div>
  <div id="res"></div>
  <div class="bank">${bank.map(t=>`<button class="c" ${sel.includes(t)||done?'disabled':''} onclick="pick('${t}')">${t}</button>`).join('')}</div>
  <div class="act">${done?`<button class="go" onclick="nextQ()">${qi+1<Q.length?'Câu tiếp':'Xem kết quả'}</button>`:`<button onclick="sel=[];quiz()">Xóa</button><button class="go" onclick="check()">Xác nhận</button>`}</div></div></div>`;
  if(done)showRes();
}
function pick(t){if(!done){snd('tap');sel.push(t);quiz()}}
function rm(j){snd('tap');sel.splice(j,1);quiz()}
function showRes(){
  const r=Q[qi],a=sel.join(' '),good=a==r.n;
  document.getElementById('res').innerHTML=`<div class="res ${good?'ok':'bad'}">${good?'Đúng rồi!':'Sai rồi'}<span>Bạn ghép: ${a}</span><span>Đáp án: <b>${r.n}</b> (${r.f=='qd'?'Quân đội':'Công an'} - ${r.g})</span></div>`;
}
function check(){
  if(!sel.length)return;
  const r=Q[qi];
  if(sel.join(' ')==r.n){ok++;snd('ok');confetti();nextQ();return}
  done=true;wrong.push(r);snd('bad');
  quiz();
}
function confetti(){
  const c=document.createElement('canvas');c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:9999';
  const W=c.width=innerWidth,H=c.height=innerHeight;document.body.appendChild(c);const x=c.getContext('2d');
  const cols=['#e8c34a','#d94b3d','#3fa66b','#3b82f6','#a855f7','#ffffff'];
  const P=Array.from({length:80},()=>({x:W/2,y:H*.65,vx:(Math.random()-.5)*16,vy:-Math.random()*15-5,s:Math.random()*6+5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  let t=0;(function f(){x.clearRect(0,0,W,H);
    P.forEach(p=>{p.vy+=.45;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-t/70);x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore()});
    if(++t<70)requestAnimationFrame(f);else c.remove()})()
}
function nextQ(){
  if(++qi>=Q.length){
    if(ok>=Q.length*.8)snd('win');
    app.innerHTML=`<div class="end"><b>${ok}/${Q.length}</b><div>${ok==Q.length?'Tuyệt đối!':'Câu sai cần xem lại:'}</div>
    <div class="grid">${wrong.map(r=>`<div class="cd">${svg(r)}${r.n}</div>`).join('')}</div>
    <button class="big pri" onclick="menu()">Về menu</button></div>`;
    return;
  }
  next0();
}
menu();
</script>
</body>
</html>
